name: wasalny_app
description: "تطبيق وصلني لتوصيل الطعام متعدد المطاعم (Production Flutter + Firebase)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase Core & Services
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.0.1

  # State Management & Utilities
  provider: ^6.1.2
  intl: any
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

  # UI & Design
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.1
  qr_flutter: ^4.1.0

  # Hardware, Audio & Printing (Sunmi 58mm)
  sunmi_printer_plus: ^2.1.2
  audioplayers: ^6.0.0
  flutter_local_notifications: ^17.1.2
  wakelock_plus: ^1.2.5

  # Maps & Navigation
  geolocator: ^12.0.0
  url_launcher: ^6.3.0

  # Export Reports (PDF & Excel)
  pdf: ^3.10.8
  printing: ^5.13.1
  excel: ^4.0.3
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
