name: Build Wasalny Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Repair and Prepare Project
        working-directory: wasalny_app
        run: |
          mkdir -p assets/sounds
          mkdir -p assets/images
          flutter create . --platforms=android --org=com.wasalny

      - name: Install Dependencies
        working-directory: wasalny_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: wasalny_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wasalny-Release-APK
          path: wasalny_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
